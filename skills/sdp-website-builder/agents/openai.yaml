interface:
  display_name: "SDP Website Builder"
  short_description: "Build and publish SDP websites"
  default_prompt: "Use $sdp-website-builder to inspect or compose an SDP website safely."
dependencies:
  tools:
    - type: "mcp"
      value: "sdp-website-builder"
      description: "SDP Website Builder hosted MCP server"
      transport: "streamable_http"
      url: "https://sdp-api.sdp-platform.com/mcp/website-builder"
policy:
  allow_implicit_invocation: true
